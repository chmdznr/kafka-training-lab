# Extra broker properties merged by the apache/kafka image on top of the
# environment variables in docker-compose.yml.
#
# The SASL listener authenticates with SCRAM-SHA-512. Credentials are stored
# in the KRaft metadata and created by the kafka-init service.
listener.name.sasl.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.sasl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
