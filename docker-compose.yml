name: kafka-training-lab

# Shared by every broker. Each broker overrides node.id and the advertised
# host listeners; everything else is identical.
x-kafka-common: &kafka-common
  image: apache/kafka:4.4.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,PLAINTEXT://:9092,SASL://:9192
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL:SASL_PLAINTEXT
  KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/jaas.conf
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_OFFSETS_TOPIC_MIN_INSYNC_REPLICAS: "2"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    ports:
      - "9092:9092"
      - "9192:9192"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,PLAINTEXT://localhost:9092,SASL://localhost:9192
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./kafka/jaas.conf:/etc/kafka/jaas.conf:ro

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    ports:
      - "9093:9092"
      - "9193:9192"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,PLAINTEXT://localhost:9093,SASL://localhost:9193
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./kafka/jaas.conf:/etc/kafka/jaas.conf:ro

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    ports:
      - "9094:9092"
      - "9194:9192"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,PLAINTEXT://localhost:9094,SASL://localhost:9194
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./kafka/server.properties:/mnt/shared/config/server.properties:ro
      - ./kafka/jaas.conf:/etc/kafka/jaas.conf:ro

  kafka-init:
    image: apache/kafka:4.4.0
    restart: "no"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/kafka/bin/kafka-configs.sh \
          --bootstrap-server kafka-1:29092 \
          --alter \
          --add-config 'SCRAM-SHA-512=[password=app-secret]' \
          --entity-type users \
          --entity-name app
        echo "SCRAM user 'app' siap"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      timeout: 5s
      retries: 12

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: ["demo"]
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "3"
      OFFSET_STORAGE_REPLICATION_FACTOR: "3"
      STATUS_STORAGE_REPLICATION_FACTOR: "3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.0.0
    profiles: ["tracing"]
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

networks:
  default:
    name: kafka-training-lab

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
